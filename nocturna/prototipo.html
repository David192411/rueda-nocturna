<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Play CDN</title>
    <!-- Script oficial de Tailwind Play CDN (MiniReto 1) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Sección principal de la campaña -->
    <main class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 space-y-6 shadow-2xl">
        
        <!-- Etiqueta de campaña -->
        <div class="inline-block bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full">
            Nuevo kit · Jueves a Domingo
        </div>

        <!-- Título único H1 y Subtítulo -->
        <div class="space-y-2">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white leading-tight">
                Rueda Nocturna
            </h1>
            <p class="text-slate-400 text-base leading-relaxed">
                Descubre Medellín en bici cuando se encienden las luces.
            </p>
        </div>

        <!-- Dos datos destacados -->
        <div class="grid grid-cols-2 gap-4 pt-2 pb-2">
            <div class="bg-slate-800/60 p-4 rounded-lg border border-slate-700/50">
                <span class="block text-xs uppercase text-slate-400 tracking-wider font-medium">Recorridos</span>
                <span class="text-2xl font-bold text-emerald-400">3 rutas</span>
            </div>
            <div class="bg-slate-800/60 p-4 rounded-lg border border-slate-700/50">
                <span class="block text-xs uppercase text-slate-400 tracking-wider font-medium">Tarifa inicial</span>
                <span class="text-2xl font-bold text-emerald-400">Desde $55.000</span>
            </div>
        </div>

        <!-- Enlace "Inscríbete" con apariencia de botón usando utilidades -->
        <div>
            <a href="#inscripcion" class="inline-block w-full text-center bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-3 rounded-lg transition-colors duration-200 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
                Inscríbete
            </a>
        </div>

    </main>

</body>
</html>
